name: Publish PinPoint Nations

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare PinPoint Nations
        shell: bash
        run: |
          mkdir -p public/pinpoint
          cp pinpoint/index.html public/pinpoint/index.html
          printf '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./pinpoint/"></head><body><a href="./pinpoint/">Open PinPoint Nations</a></body></html>' > public/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
